server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # App Links / Universal Links verification files. Served as JSON with no
    # SPA fallback (a missing file must 404, not return index.html), and the
    # extensionless apple-app-site-association needs an explicit content type.
    location /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
