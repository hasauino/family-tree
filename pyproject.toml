[project]
name = "familytree"
version = "0.1.0"
description = "A website for storing, browsing, and updating a family tree."
authors = [
    { name = "Hassan Umari", email = "oh91@windowslive.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2,<5.0",
    "django-registration>=3.3,<4.0",
    "wagtail>=5.1,<6.0",
    "wand==0.6",
    "graphene-django>=3.1,<4.0",
    "gunicorn>=21.2,<22.0",
    "django-pwa>=1.1,<2.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.envs.default]
dependencies = [
    "ruff",
    "ipython",
]

[tool.hatch.envs.default.scripts]
server = "familytree/manage.py runserver {args}"
makemessages = "familytree/manage.py makemessages -a {args}"
compilemessages = "familytree/manage.py compilemessages {args}"
shell = "familytree/manage.py shell {args}"
fix = [
    "ruff format {args:.}",
    "ruff check --fix {args:.}",
]
style = [
    "ruff format --check {args:.}",
    "ruff check {args:.}",
]

[tool.ruff]
extend-exclude = ["**/migrations/*"]
line-length = 119

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"familytree/project/settings/*.py" = ["F405"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
