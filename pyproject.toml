[project]
name = "familytree"
version = "0.1.0"
description = "A website for storing, browsing, and updating a family tree."
authors = [
    { name = "Hassan Umari", email = "oh91@windowslive.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "django>=6.0,<7.0",
    "django-registration>=5.2,<6.0",
    "wagtail>=7.0,<8.0",
    "wand==0.6",
    "graphene-django>=3.1,<4.0",
    "gunicorn>=26.0,<27.0",
    "django-pwa>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.envs.default]
python = "3.14"
dependencies = [
    "ruff",
    "ipython",
]

[tool.hatch.envs.default.scripts]
server = "familytree/manage.py runserver {args}"
makemessages = "familytree/manage.py makemessages -a {args}"
compilemessages = "familytree/manage.py compilemessages {args}"
shell = "familytree/manage.py shell {args}"
makemigrations = "familytree/manage.py makemigrations {args}"
migrate = "familytree/manage.py migrate {args}"
createsuperuser = "familytree/manage.py createsuperuser {args}"
collectstatic = "familytree/manage.py collectstatic {args}"
test = "familytree/manage.py test {args}"
fix = [
    "ruff format {args:.}",
    "ruff check --fix {args:.}",
]
style = [
    "ruff format --check {args:.}",
    "ruff check {args:.}",
]

[tool.ruff]
extend-exclude = ["**/migrations/*"]
line-length = 119

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"familytree/project/settings/*.py" = ["F405"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
